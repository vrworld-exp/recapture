services:
  - type: web
    name: recapture-api
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      # This blueprint deploys the DEV instance (recapture-apis-dev). NODE_ENV
      # must stay non-production here: it gates the send-otp devCode echo the
      # dev probe depends on, and maps S3 keys to the dev/ prefix.
      - key: NODE_ENV
        value: development
      # NO explicit PORT. Render injects its own, and hardcoding one here
      # overrides it — the app then listens on a port the platform is not
      # routing to, which surfaces as "No open ports detected" on deploy.
      # src/config/env.ts still defaults to 3000 for local runs.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # OTP mail (Gmail SMTP). Declared here so the deployment DECLARES what it
      # needs; the values are set in the Render dashboard and never enter the
      # repo. These replace literal fallbacks that used to sit in
      # src/utils/nodeMailerTransport.ts — see that file's header. Without both
      # set, sendEmail throws and OTP mail does not go out, which is the
      # intended loud failure rather than a silent one.
      - key: USER_EMAIL_FOR_NODMAILER
        sync: false
      - key: USER_PASS_FOR_NODMAILER
        sync: false
      # ── Same-day activation ────────────────────────────────────────────────
      # ⚠ PUBLIC_RESOLVER_BASE_URL IS EFFECTIVELY PERMANENT. Every printed
      # standee encodes {PUBLIC_RESOLVER_BASE_URL}/r/{code}, and activation
      # freezes that exact string into catalog.publicUrl, where
      # assertMappingImmutable refuses to rewrite it. Changing this value later
      # does NOT repoint codes already printed — it only affects codes minted
      # after the change. Treat it as append-only in production.
      #
      # The value is THIS API's own public origin, because /r is mounted on this
      # service (app.ts: app.use('/r', publicRouter)) — or a short custom domain
      # that fronts it, which is worth having before the first real print run:
      # a diner reads this off a table, and it can never be shortened later.
      #
      # Unset is a SAFE state, not a broken one: minting, the batch CSV and the
      # standee render all answer 409 RESOLVER_NOT_CONFIGURED rather than
      # emitting URLs against a guessed host that would then be printed.
      - key: PUBLIC_RESOLVER_BASE_URL
        sync: false
      # Origin of the WEB client, used only to build the rep's one-tap
      # activation link on the public "not live yet" page. Unset degrades
      # cleanly — the page renders WITHOUT the link rather than with a broken
      # one — so this is optional in a way the resolver origin is not.
      - key: WEB_APP_BASE_URL
        sync: false
      # Buckets live in us-east-1 (verified via scripts/aws-smoke-test.ts);
      # ap-south-1 here makes every presigned URL fail with a region error.
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_RAW
        value: msxr-raw-captures
      - key: S3_BUCKET_ARTIFACTS
        value: msxr-model-artifacts
      - key: CLOUDFRONT_BASE_URL
        sync: false
      # Browser origins allowed to call this API (comma-separated, exact match).
      # The web client deployed at recapture-live; the mobile builds send no
      # Origin header and never consult this. NODE_ENV is `development` on this
      # instance, so localhost:* is additionally allowed for local web runs.
      - key: CORS_ALLOWED_ORIGINS
        value: https://recapture-live.onrender.com
      # This web service also runs the job loop in-process, so there is no
      # separate worker service to deploy or pay for. Only valid while every
      # processor is I/O-bound (the Meshy path is HTTP + sleep); when the
      # capture pipeline does real CPU work, split it out and set this false.
      #
      # ⚠ THAT CONDITION IS NOW BROKEN. MODEL_OPTIMIZATION is the first genuinely
      # CPU-BOUND processor: glTF-Transform, meshopt and sharp all run
      # synchronously on the event loop, so a large model stalls THIS API for the
      # duration. It is bounded (MODEL_OPTIMIZE_MAX_INPUT_BYTES caps the input at
      # 250 MiB, and the owner route is rate-limited), but the right shape is a
      # separate worker service: set this false here and deploy `npm run worker`
      # alongside. Left true only because flipping it with no worker deployed
      # would mean NOTHING processes jobs at all.
      - key: RUN_WORKER_IN_PROCESS
        value: true
      # Required BECAUSE of the flag above — the process running the loop is the
      # one that calls Meshy, and it fails fast at boot without this. Set the
      # value in the Render dashboard; it is a secret and must not live here.
      - key: MESHY_API_KEY
        sync: false
    autoDeploy: true