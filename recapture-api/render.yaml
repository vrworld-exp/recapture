services:
  - type: web
    name: recapture-api
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      # This blueprint deploys the DEV instance (recapture-apis-dev). NODE_ENV
      # must stay non-production here: it gates the send-otp devCode echo the
      # dev probe depends on, and maps S3 keys to the dev/ prefix.
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # Buckets live in us-east-1 (verified via scripts/aws-smoke-test.ts);
      # ap-south-1 here makes every presigned URL fail with a region error.
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_RAW
        value: msxr-raw-captures
      - key: S3_BUCKET_ARTIFACTS
        value: msxr-model-artifacts
      - key: CLOUDFRONT_BASE_URL
        sync: false
      # Browser origins allowed to call this API (comma-separated, exact match).
      # The web client deployed at recapture-live; the mobile builds send no
      # Origin header and never consult this. NODE_ENV is `development` on this
      # instance, so localhost:* is additionally allowed for local web runs.
      - key: CORS_ALLOWED_ORIGINS
        value: https://recapture-live.onrender.com
      # This web service also runs the job loop in-process, so there is no
      # separate worker service to deploy or pay for. Only valid while every
      # processor is I/O-bound (the Meshy path is HTTP + sleep); when the
      # capture pipeline does real CPU work, split it out and set this false.
      #
      # ⚠ THAT CONDITION IS NOW BROKEN. MODEL_OPTIMIZATION is the first genuinely
      # CPU-BOUND processor: glTF-Transform, meshopt and sharp all run
      # synchronously on the event loop, so a large model stalls THIS API for the
      # duration. It is bounded (MODEL_OPTIMIZE_MAX_INPUT_BYTES caps the input at
      # 250 MiB, and the owner route is rate-limited), but the right shape is a
      # separate worker service: set this false here and deploy `npm run worker`
      # alongside. Left true only because flipping it with no worker deployed
      # would mean NOTHING processes jobs at all.
      - key: RUN_WORKER_IN_PROCESS
        value: true
      # Required BECAUSE of the flag above — the process running the loop is the
      # one that calls Meshy, and it fails fast at boot without this. Set the
      # value in the Render dashboard; it is a secret and must not live here.
      - key: MESHY_API_KEY
        sync: false
    autoDeploy: true
