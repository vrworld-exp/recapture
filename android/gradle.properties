org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental compilation breaks when the pub cache (C:) and the build
# dir (D:) are on different drives ("different roots" cache-close failure).
kotlin.incremental=false
# AGP 8.11 was tested up to compileSdk 36; we compile against 37 because a
# plugin (flutter_secure_storage) requires it. Silences the "not tested" warning.
android.suppressUnsupportedCompileSdk=37
