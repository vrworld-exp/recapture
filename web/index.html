<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="recapture">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>recapture</title>
  <link rel="manifest" href="manifest.json">

  <!-- model-viewer reads `self.ModelViewerElement` ONCE, when its module runs,
       so this classic script MUST stay above the module tag below.

       Why it exists: our OPTIMIZED (`OPT`) renditions are meshopt-compressed,
       and gltf-transform lists EXT_meshopt_compression in `extensionsRequired`.
       Unlike DRACO and KTX2 — which model-viewer points at gstatic by default —
       meshopt has NO default decoder location, so without this the loader
       throws "setMeshoptDecoder must be called before loading compressed files"
       and every optimized model dies as an unexplained "couldn't load".

       The decoder itself is already BUNDLED (its WASM is inlined in
       model-viewer.min.js); the URL is only the trigger that makes
       model-viewer wire it into the loader, which is why the pinned version
       here need not match the backend's encoder. -->
  <script>
    window.ModelViewerElement = window.ModelViewerElement || {};
    window.ModelViewerElement.meshoptDecoderLocation =
      'https://unpkg.com/meshoptimizer@0.20.0/meshopt_decoder.js';
  </script>

  <!-- model_viewer_plus (3D model viewer): on web the package strips the
       <script> from its own HTML template and requires the <model-viewer>
       custom element to be registered here instead — without this line the
       viewer renders an inert blank element. -->
  <script type="module" src="assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
