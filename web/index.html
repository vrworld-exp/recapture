<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="recapture">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>recapture</title>
  <link rel="manifest" href="manifest.json">

  <!-- model-viewer configuration. MUST come BEFORE the module script below:
       model-viewer reads `self.ModelViewerElement` exactly once, when its
       module evaluates, and a value set afterwards is ignored.

       meshoptDecoderLocation is LOAD-BEARING, not an optimization. The backend
       optimizer emits EXT_meshopt_compression in `extensionsRequired`, and
       model-viewer ships DRACO/KTX2 decoder locations by default but NOT a
       meshopt one — unconfigured, GLTFLoader rejects every optimized model and
       the app shows "we couldn't load this model". The decoder is already
       bundled inside model-viewer.min.js; this URL is only the trigger that
       makes it load it, so a no-op data: script is enough and costs no request.

       Keep this value IDENTICAL to kMeshoptDecoderLocation in
       lib/presentation/screens/projects/model_render_view.dart — the mobile
       WebView builds its own page and inherits nothing from this file.
       test/projects/meshopt_decoder_test.dart asserts the two still agree. -->
  <script>
    window.ModelViewerElement = window.ModelViewerElement || {};
    window.ModelViewerElement.meshoptDecoderLocation = 'data:text/javascript,0';
  </script>

  <!-- model_viewer_plus (3D model viewer): on web the package strips the
       <script> from its own HTML template and requires the <model-viewer>
       custom element to be registered here instead — without this line the
       viewer renders an inert blank element. -->
  <script type="module" src="assets/packages/model_viewer_plus/assets/model-viewer.min.js" defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
