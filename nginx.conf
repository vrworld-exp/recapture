# ─────────────────────────────────────────────────────────────────────────────
# ReCapture — static serving config for the Flutter Web bundle.
#
# This file is installed as /etc/nginx/templates/default.conf.template (see the
# Dockerfile), so nginx's entrypoint expands ${PORT} through envsubst before
# nginx ever reads it. Only names present in the environment are substituted —
# $uri below is nginx's own variable and passes through untouched.
#
# mime.types is already included by the base image's http block, so .wasm,
# .json and .js all get correct Content-Type here without restating them. Do
# NOT add a `types { }` block: it REPLACES the inherited map rather than
# extending it, and Flutter's canvaskit .wasm would start being served as
# application/octet-stream, which browsers refuse to instantiate.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # main.dart.js is multiple MB and canvaskit adds several more. Compressed,
    # this is the difference between a fast first paint and a visibly blank
    # screen on a phone. application/wasm matters most of all here.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    #
    # text/javascript AND application/javascript are both listed on purpose:
    # nginx 1.21.1 changed the mime.types mapping for .js from the latter to
    # the former. List only application/javascript and main.dart.js — by far
    # the largest file served — silently ships uncompressed on a current image.
    gzip_types text/plain
               text/css
               text/javascript
               application/javascript
               application/json
               application/wasm
               application/manifest+json
               image/svg+xml;

    # Note on add_header inheritance: a location that sets ANY add_header stops
    # inheriting the server-level ones. That is why this header is repeated in
    # the cache-control locations below rather than stated once here.
    add_header X-Content-Type-Options "nosniff" always;

    # ── SPA fallback ────────────────────────────────────────────────────────
    # go_router owns /login, /projects/<id>, /capture/… entirely client-side —
    # no such file exists on disk. Without this rewrite, opening one of those
    # URLs directly, or simply hitting refresh on one, is a hard 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Never cache the three files that announce a new build ───────────────
    # index.html, the service worker and version.json are how a returning
    # browser discovers that a deploy happened. Cache them and users stay
    # pinned to the previous build until they hard-reload — the single most
    # common "I deployed but nothing changed" cause on Flutter Web.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Build output: hashed by the build, safe to cache ────────────────────
    # `=404` instead of falling through to index.html is deliberate: a missing
    # asset should fail as a missing asset. Serving HTML in its place turns a
    # clear 404 into an opaque JS syntax error at the first byte.
    #
    # max-age is spelled out in add_header rather than using `expires`: the two
    # do not compose. `expires` emits its own Cache-Control, so pairing it with
    # an add_header of the same name sends the header TWICE.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # canvaskit is versioned by the SDK and only ever replaced by a new build,
    # so it earns `immutable` and a full year.
    location /canvaskit/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /flutter.js    { try_files $uri =404; }
    location = /main.dart.js  { try_files $uri =404; }
    location = /manifest.json { try_files $uri =404; }
    location = /favicon.png   { try_files $uri =404; }
}