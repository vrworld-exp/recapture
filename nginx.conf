# =============================================================================
# nginx server block for the ReCapture Flutter Web bundle
# =============================================================================
#
# This file is a TEMPLATE. The Dockerfile installs it at
# /etc/nginx/templates/default.conf.template, and the stock nginx entrypoint
# expands ${PORT} into /etc/nginx/conf.d/default.conf when the container
# starts. nginx's own runtime variables ($uri, $host, ...) are written without
# braces and are therefore left alone by envsubst — keep it that way.
#
# It is included inside the stock `http { }` block, which is why `map` is legal
# here and why there is no `events`/`http` wrapper.
# =============================================================================


# ── Cache policy ─────────────────────────────────────────────────────────────
#
# Flutter Web does NOT content-hash its filenames: every build emits
# main.dart.js, assets/AssetManifest.bin, canvaskit/canvaskit.wasm at exactly
# those paths. A long `max-age` would therefore serve a browser last week's
# main.dart.js against this week's assets — a white screen with no way for the
# user to recover except a hard reload. So:
#
#   * everything is cacheable but must be revalidated (ETag -> 304 Not
#     Modified, a few hundred bytes, no re-download when unchanged);
#   * the handful of files that bootstrap a version — index.html,
#     flutter_bootstrap.js, the service worker — are never stored, so a
#     redeploy is picked up on the next page load rather than the next purge.
#
# This is the correct trade for an app whose files are versioned by the Docker
# image rather than by their URL. If you later switch to a hashed-asset
# pipeline, immutable long-lived caching becomes safe and belongs here.
map $uri $recapture_cache_control {
    default                       "public, max-age=0, must-revalidate";
    "/"                           "no-store";
    "/index.html"                 "no-store";
    "/flutter_bootstrap.js"       "no-store";
    "/flutter_service_worker.js"  "no-store";
    "/version.json"               "no-store";
    "/manifest.json"              "no-store";
}

server {
    # Expanded from the PORT environment variable: 80 by default (so
    # `docker run -p 8080:80` works), whatever Render injects in production.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Behind Render's TLS terminator the container sees plain HTTP on an
    # internal port. Absolute redirects would leak that port into the
    # Location header and send users to a dead URL; relative ones cannot.
    absolute_redirect off;
    port_in_redirect off;

    # ── Compression ──────────────────────────────────────────────────────────
    #
    # gzip_static serves the .gz files the Dockerfile pre-built with gzip -9.
    # Plain gzip stays on as the fallback for anything not pre-compressed.
    gzip_static on;
    gzip         on;
    gzip_vary    on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # ── Response headers ─────────────────────────────────────────────────────
    #
    # Declared at server level, never inside a location: an `add_header` in a
    # location block REPLACES the inherited set rather than adding to it, so
    # per-location headers would silently drop these.
    add_header Cache-Control          $recapture_cache_control always;
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # DELIBERATELY ABSENT: Cross-Origin-Opener-Policy / -Embedder-Policy.
    # They would unlock Flutter's multi-threaded skwasm renderer, but COEP
    # blocks every cross-origin subresource that does not opt in with CORP —
    # and this app loads product images from S3 and GLB models from CloudFront.
    # Turning them on breaks the catalog to speed up rendering. Not worth it
    # unless those buckets start sending Cross-Origin-Resource-Policy.

    # ── Health check ─────────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── SPA routing ──────────────────────────────────────────────────────────
    #
    # This is the rule that closes note F of docs/next-phase/
    # web-capability-matrix.md. go_router owns /projects, /catalog,
    # /catalog/products/:id and the rest CLIENT-side; a refresh or a pasted
    # deep link is a real GET that nginx must answer with the app shell instead
    # of 404, letting the router take it from there.
    #
    # try_files checks the real file first, so /main.dart.js and
    # /assets/... are still served as themselves — only genuinely unknown
    # paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE — do NOT add the usual `location ~ /\. { deny all; }` dotfile rule
    # here. This app's own configuration ships as Flutter assets at
    # /assets/.env and /assets/.env.prod; denying dotfiles makes dotenv fail to
    # load and the app boots with no API base URL.
}
