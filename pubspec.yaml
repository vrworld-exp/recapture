name: recapture
description: "ReCapture — guided photogrammetry capture app by MayasabhaXR Technologies."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^17.3.0

  # Local storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Secure storage (auth tokens — OS Keychain / Keystore)
  flutter_secure_storage: ^11.0.0

  # Networking
  dio: ^5.4.3

  # Environment config
  flutter_dotenv: ^6.0.1

  # Device permissions
  permission_handler: ^13.0.0

  # Gallery picker for the profile picture. Chosen over an image-processing
  # package because its maxWidth/maxHeight/imageQuality arguments resize and
  # re-encode NATIVELY — no `image` package, no isolate, no extra binary weight
  # for the downscale. Gallery only; the camera stays the bespoke native
  # pipeline. Android 13+ reaches the system photo picker with no runtime
  # permission, so this adds no manifest permission either.
  image_picker: ^1.1.2

  # Connectivity
  connectivity_plus: ^7.1.1

  # App-scoped directories (dev-probe test bundles on disk)
  path_provider: ^2.1.4

  # Hashing (per-file MD5 checksums for the upload manifest — streaming digest)
  crypto: ^3.0.3

  # Code generation annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  share_plus: ^13.2.0

  # 3D model viewer (GLB) for generated models — model-viewer web component
  # under the hood; renders the CloudFront glbUrl with orbit controls + AR.
  model_viewer_plus: ^1.9.3

  # Typed DOM interop (web builds only) — the model-viewer load probe reads the
  # injected element's `loaded` state, since no JS channel exists on web.
  web: ^1.1.1

  # In-app QR scanning for the rep standee flow.
  #
  # THE WRITTEN JUSTIFICATION rep_capabilities_io.dart asks for before this
  # package exists at all:
  #
  #   • The alternative was native work on THREE targets. Decoding inside our
  #     own camera channel means MLKit on Android and Vision on iOS, and the
  #     browser has no bespoke channel to extend at all. This package covers
  #     android / ios / macos / web from one Dart call site, so the rep surface
  #     stays ONE screen rather than three implementations that drift.
  #   • It does NOT touch the capture pipeline. The 6-photo ring keeps its
  #     bespoke MethodChannel (lib/platform/camera); this plugin owns a separate
  #     short-lived preview that exists only while the scanner sheet is open.
  #     Nothing in lib/platform changes, and no capture code imports it.
  #   • Web support is first-party here (MobileScannerWeb), not a community
  #     shim — which is what makes the scan capability true on BOTH targets and
  #     retires the last asymmetry the rep surface had.
  #
  # Android needs no new manifest permission (CAMERA is already declared for
  # capture); iOS reuses the existing NSCameraUsageDescription.
  mobile_scanner: ^7.4.0

dependency_overrides:
  # permission_handler_android 14.0.0 requires AGP 9 / Kotlin 2.3. Its
  # android/build.gradle.kts calls the top-level `kotlin { compilerOptions { … } }`
  # extension WITHOUT ever applying the Kotlin Gradle plugin (its `plugins` block
  # only applies com.android.library), so on our AGP 8.11.1 toolchain the script
  # fails to COMPILE — "Unresolved reference: jvmTarget" — and every Android build
  # dies at configuration time, debug and release alike.
  #
  # 13.0.1 is the last release with the plain Groovy build file (AGP 8, Java-only,
  # no Kotlin block). The pin is unusually safe here: on ANDROID this plugin is
  # never CALLED at all. `_routingTable` in lib/platform/permissions_service.dart
  # routes every Android permission to the native MethodChannel (androidNative) or
  # to permissionFree; permission_handler serves iOS only, through
  # permission_handler_apple, which this override does not touch.
  #
  # Drop this when the Android toolchain moves to AGP 9 + Kotlin 2.3
  # (android/settings.gradle.kts).
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App launcher icon generation
  flutter_launcher_icons: ^0.14.3

  # Code generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.dev
    - .env.staging
    - .env.prod
    - assets/images/
    - assets/fonts/

flutter_launcher_icons:

  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  web:
    generate: true
    image_path: "assets/icons/icon.png"